    <circle cx="35" cy="35" r="28" fill="rgba(255, 255, 255, 0.25)"/>
    
    <path d="M35 15 C30 25, 20 32, 20 44 C20 52, 26 58, 35 58 C44 58, 50 52, 50 44 C50 32, 40 25, 35 15 Z" fill="#FFFFFF"/>
